const layers=[
 {id:'model',ready:true,sources:[],name:'心智模型',en:'MENTAL MODEL',sub:'先建立一个直觉',title:'后台任务：先接收，再执行',desc:'后台任务系统把耗时工作从当前请求中拆出来：先保存任务并返回编号，再由后台执行，用户稍后查询状态和结果。它解决的是请求长时间等待的问题。',time:'约 2 分钟',goal:'理解它解决什么问题',quiz:'用户提交了一份大报表，页面很快返回。这代表什么？',options:['报表已经生成完了','系统已接收任务，结果需要稍后查看'],answer:1,explain:'“已接收”和“已完成”是两件事。后台系统把提交与执行分开，结果还要再查询。'},
 {id:'capabilities',ready:true,sources:[],name:'能干什么',en:'CAPABILITIES',sub:'把概念放进场景',title:'哪些工作适合放到后台？',desc:'从你熟悉的操作出发，看清什么时候值得把工作交给后台，以及最后会得到什么。',time:'约 3 分钟',goal:'识别合适的业务场景',quiz:'下面哪件事更适合交给后台任务系统？',options:['打开页面时读取当前用户名','生成十万行的月度对账报表'],answer:1,explain:'对账报表通常耗时较长，而且用户可以稍后取结果。读取用户名一般需要立即返回，不必引入后台任务。'},
 {id:'journey',ready:true,sources:[],name:'业务全链路',en:'THE FULL JOURNEY',sub:'跟着一条请求走',title:'一份报表，从提交到完成',desc:'小林点击“导出报表”之后，系统里究竟发生了什么？每次往前走一步，只看这一步的责任。',time:'约 5 分钟',goal:'串起提交、执行和结果',quiz:'如果后台工作进程突然退出，为什么还需要保存任务记录？',options:['让系统仍能查询状态，并为恢复处理提供依据','保证任何任务都绝对不会重复执行'],answer:0,explain:'持久化保留任务事实，但不会自动保证只执行一次。恢复、重试和幂等仍需要单独设计。'},

];
const scenarios=[
 {name:'导出报表',request:'“帮我导出本月的销售明细。”',action:'先记录导出任务，后台汇总数据、生成文件。',result:'一个任务编号，以及稍后可下载的报表。'},
 {name:'批量通知',request:'“把活动提醒发给这批用户。”',action:'先接收发送请求，后台分批投递并记录结果。',result:'每批发送的进度，以及成功与失败的明细。'},
 {name:'处理图片',request:'“把这批原图处理成缩略图。”',action:'后台逐张读取、缩放并保存新图片。',result:'处理进度，以及生成后的缩略图地址。'}

const steps=[
 {title:'提交请求',who:'用户 → API',text:'小林点击“导出报表”。页面提交时间范围与导出条件，API 检查参数是否有效。',data:'request = { range: "本月", format: "csv" }'},
 {title:'保存任务',who:'API → 任务记录',text:'API 创建一条待执行记录，再返回任务编号。此时只承诺已经接收，不代表报表已经生成。',data:'task = { id: "T-001", status: "PENDING" }'},
 {title:'领取任务',who:'调度器 → Worker',text:'调度器寻找待执行任务，尝试将其中一个原子地标记为运行中，再交给工作进程。并发领取需要单独处理。',data:'status: PENDING → RUNNING'},
 {title:'生成报表',who:'Worker → 报表业务',text:'工作进程读取业务数据、生成报表文件。耗时工作发生在后台，小林不必让提交请求一直保持连接。',data:'input: task.payload → output: report.csv'},
 {title:'记录结果',who:'Worker → 任务记录',text:'执行成功后保存文件地址，并更新任务状态；失败则记录错误。重试策略属于进一步的实现设计。',data:'status: RUNNING → SUCCEEDED / FAILED'},
 {title:'查看结果',who:'用户 → API → 任务记录',text:'小林使用任务编号查询。完成时看到下载地址；尚未完成时看到当前状态；失败时看到可处理的提示。',data:'GET task(T-001) → { status, result, error }'}
];
const modules=[
 {name:'接收请求',code:'API',owns:'请求校验规则；不在请求内生成报表',entry:'提交任务、查询任务',depends:'任务存储；由用户页面调用',failure:'保存任务失败时返回错误，不宣称接收成功。',summary:'把用户意图变成一条可追踪的任务记录。',pseudo:'validate(request)\n<span class="code-key">task</span> = store.create(request, PENDING)\n<span class="code-key">return</span> task.id',edge:'提交成功但响应丢失时，用户可能重复提交。真实系统应根据业务需要设计请求幂等键。'},
 {name:'调度领取',code:'Scheduler',owns:'轮询节奏与领取策略',entry:'扫描并领取待执行任务',depends:'任务存储、Worker；由调度循环调用',failure:'领取后进程退出，需要超时回收或租约等恢复机制。',summary:'让待执行任务进入执行阶段，并处理并发竞争。',pseudo:'candidates = store.findPending()\n<span class="code-key">for</span> task <span class="code-key">in</span> candidates:\n  <span class="code-key">if</span> store.claimAtomically(task.id):\n    worker.execute(task)',edge:'查询待执行任务本身不能防止重复领取。领取必须使用条件更新、锁或其他经验证的并发控制机制。'},
 {name:'执行业务',code:'Worker',owns:'当前任务的执行上下文',entry:'执行一个已领取的任务',depends:'报表业务、文件存储、任务存储',failure:'保存异常信息；进程崩溃时由恢复机制处理遗留任务。',summary:'完成真正的耗时工作，再把结果交回任务记录。',pseudo:'<span class="code-key">try</span>:\n  result = report.generate(task.payload)\n  store.succeed(task.id, result)\n<span class="code-key">catch</span> error:\n  store.fail(task.id, error)',edge:'“文件已生成、成功状态未保存”是可能出现的故障窗口。真实系统需要明确重试、结果复用和副作用幂等策略。'}
];
const $=s=>document.querySelector(s);
let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch{}
let mastered=new Set(Array.isArray(saved.mastered)?saved.mastered.filter(x=>layers.some(l=>l.id===x&&l.ready!==false)):[]);
let scenario=0,step=0,moduleIndex=0,current=0,answers={};
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({mastered:[...mastered]}))}catch{}}
function announce(s){$('#announcement').textContent=s}
function routeValue(key,fallback,max){const n=Number(new URLSearchParams(location.hash.split('?')[1]||'').get(key));return Number.isInteger(n)&&n>=0&&n<max?n:fallback}
function updateRoute(key,value){const id=layers[current].id;const p=new URLSearchParams(location.hash.split('?')[1]||'');p.set(key,value);history.replaceState(null,'','#'+id+'?'+p.toString())}
function nav(){
 $('#layerNav').innerHTML=layers.map((l,i)=>`<a class="nav-item" href="#${l.id}" ${i===current?'aria-current="page"':''}><span class="nav-num">0${i+1}</span><span><strong>${l.name}</strong>${l.ready===false?'<small class="pending-label">待学习</small>':''}</span><span class="check" aria-label="${mastered.has(l.id)?'已确认理解':'未确认理解'}">${mastered.has(l.id)?'✓':''}</span></a>`).join('');
 $('#progressText').textContent=`${mastered.size} / 5`;$('#progressFill').style.transform='scaleX('+mastered.size/5+')';$('.progress-track').setAttribute('aria-valuenow',mastered.size);
}
function scenarioHTML(){
 const examples=[
  ['小林要导出本月的销售报表。直接在请求里生成文件，就要让页面一直等待；数据多时，还可能等到请求超时。后台任务系统先保存导出条件，返回一个任务编号，让这次提交请求尽快结束。','随后，后台工作进程读取任务、汇总数据并生成文件，把下载地址保存到任务记录里。小林用任务编号再次查询，看到的可能是“处理中”“已完成”或“失败”。提交与获取结果分成了两次交互，任务编号把它们连接起来。'],
  ['运营要把活动提醒发给一批用户。页面提交发送范围和消息内容后，系统先创建任务并返回编号，后台再分批投递；运营不必等到所有消息都发完。','每一批发送后，系统记录进度、成功数量和失败信息。运营通过任务编号查询处理情况。任务接收成功只说明发送工作已经被安排，并不代表每个用户都收到了消息。'],
  ['用户一次上传许多原图，希望生成缩略图。系统先记录处理任务并返回编号，后台工作进程再逐张读取图片、缩放并保存新文件，避免上传请求一直占着连接等待。','每张图片的处理结果被记入任务进度。用户再次查询时，得到已完成数量和可用的缩略图地址；如果某张处理失败，可以看到对应错误，而不是把整批图片都当成成功。']
 ];
 return '<div class="scenario-body prose" id="scenarioBody"><p>'+examples[scenario][0]+'</p><p>'+examples[scenario][1]+'</p></div>'
}
function modelBody(){return `<div class="reading-flow" aria-label="用户提交请求，系统记录任务，后台执行，用户查询结果"><div><strong>提交请求</strong><span>说明要做什么</span></div><span class="flow-arrow" aria-hidden="true">→</span><div><strong>记录任务</strong><span>返回任务编号</span></div><span class="flow-arrow" aria-hidden="true">→</span><div><strong>后台执行</strong><span>完成耗时工作</span></div><span class="flow-arrow" aria-hidden="true">→</span><div><strong>查询结果</strong><span>凭编号查看状态</span></div></div><section class="reading-section"><div class="example-header"><h2>用一个场景把它串起来</h2><div class="scenario-tabs" role="group" aria-label="业务场景">${scenarios.map((s,i)=>`<button type="button" data-scenario="${i}" aria-pressed="${i===scenario}">${s.name}</button>`).join('')}</div></div>${scenarioHTML()}</section><section class="reading-section prose"><h2>关键区别：接收成功，不等于执行完成</h2><p>后台任务把原本连在一起的“接收请求”和“执行工作”拆开了。页面很快返回，表示系统已经接下这件事；真正的业务结果，要等后台完成后再获取。可以把任务编号理解成取件号：<strong>拿到号码，说明已受理；能否取件，要看处理状态。</strong></p><div class="comparison-wrap"><table class="comparison"><caption class="sr-only">同步处理和后台任务的区别</caption><thead><tr><th scope="col">处理方式</th><th scope="col">提交时得到什么</th><th scope="col">耗时工作在哪里完成</th></tr></thead><tbody><tr><th scope="row">同步处理</th><td>等待后得到最终结果</td><td>当前请求内</td></tr><tr><th scope="row">后台任务</th><td>先拿任务编号，稍后查结果</td><td>独立的后台工作进程</td></tr></tbody></table></div><p>任务记录还需要保存状态、结果或错误，让用户知道事情办到哪一步。<strong>队列只解决排队问题</strong>，执行者、状态保存、失败恢复仍要分别设计；有了后台任务，也不代表工作一定更快或一定成功。</p></section>`}
function capabilityBody(){return `<div class="capabilities">${scenarios.map((s,i)=>`<section class="panel capability"><span class="cap-num">0${i+1}</span><div><h2>${s.name}</h2><div class="cap-cols"><div><small>你说什么</small><p>${s.request}</p></div><div><small>系统做什么</small><p>${s.action}</p></div><div><small>你得到什么</small><p>${s.result}</p></div></div></div></section>`).join('')}</div><div class="callout">共同点：工作耗时较长，用户可以稍后取结果，并且需要知道处理进度。</div>`}
function stepDetail(){const s=steps[step];return `<div class="step-detail" id="stepDetail"><span class="tag">${step+1} / 6 &nbsp; ${s.who}</span><h2>${s.title}</h2><p>${s.text}</p><div class="data-strip"><code translate="no">${s.data}</code></div><div class="step-controls"><button class="secondary" type="button" data-step="${step-1}" ${step===0?'disabled':''}>← 上一步</button><button class="primary" type="button" data-step="${step+1}" ${step===5?'disabled':''}>下一步 →</button></div></div>`}
function journeyBody(){return `<section class="panel step-layout" aria-label="报表任务六步推演"><nav class="step-list" aria-label="链路步骤">${steps.map((s,i)=>`<button class="step-btn" type="button" data-step="${i}" ${i===step?'aria-current="step"':''}><span>0${i+1}</span>${s.title}</button>`).join('')}</nav>${stepDetail()}</section><div class="callout"><strong>这条链路的关键：</strong>提交请求先结束，后台执行继续进行。任务编号把两段过程连接起来。</div><details><summary>再看一条失败路径</summary><p>如果第 4 步生成报表出错，第 5 步记录失败状态和错误，第 6 步向用户展示失败提示。是否自动重试、何时重试，需要由真实实现明确决定。</p></details>`}
function moduleFacts(m){return `<dl class="facts"><div><dt>拥有什么状态 / 规则</dt><dd>${m.owns}</dd></div><div><dt>暴露什么入口</dt><dd>${m.entry}</dd></div><div><dt>依赖谁、被谁调用</dt><dd>${m.depends}</dd></div><div><dt>失败 / 重启会怎样</dt><dd>${m.failure}</dd></div></dl>`}
function archDetail(){const m=modules[moduleIndex];return `<div class="arch-detail" id="archDetail"><h3>${m.code} · ${m.name}</h3>${moduleFacts(m)}</div>`}
function architectureBody(){return `<section class="panel architecture"><div class="panel-head"><h2>职责地图</h2><span class="overline">点击模块查看职责</span></div><div class="arch-grid" role="group" aria-label="模块">${modules.map((m,i)=>`<button class="arch-node" data-arch="${i}" aria-pressed="${i===moduleIndex}" type="button"><strong>${m.code}</strong><small>${m.name}</small></button>`).join('')}</div><div class="arch-join">API 创建 / 查询 · 调度器领取 · Worker 更新结果<br><span aria-hidden="true">↓ &nbsp; ↓ &nbsp; ↓</span></div><div class="arch-store">任务记录 / Task Store <small> &nbsp; 状态 · 输入 · 结果 · 错误</small></div>${archDetail()}</section><div class="two-col"><section class="panel note-panel tinted"><span class="mini-label">模块协作</span><h2>调用关系与数据关系分开看</h2><p>调度器把任务交给 Worker 执行；三个模块都访问任务记录。共享数据不代表彼此直接调用。</p></section><section class="panel note-panel"><span class="mini-label amber">设计边界</span><h2>保存记录只是恢复的前提</h2><p>恢复还需要领取超时、租约或其他机制。不能仅凭“有数据库”就承诺任务永不丢失。</p></section></div>`}
function implementationDetail(){const m=modules[moduleIndex];return `<section class="panel module" id="moduleDetail"><span class="overline">模块 ${moduleIndex+1} · ${m.code}</span><h2>${m.name}：${m.summary}</h2><p>先回答四个问题，再阅读具体逻辑。</p>${moduleFacts(m)}<details><summary>展开教学伪代码</summary><pre class="code-block" translate="no"><span class="code-comment"># 教学伪代码，非真实项目实现</span>\n${m.pseudo}</pre></details><details><summary>需要时再看：失败边界</summary><p>${m.edge}</p></details><div class="source-note">示例未绑定真实代码库。用于项目时，请在这里补充已验证的文件路径与行号，并用真实源码替换伪代码。</div></section>`}
function implementationBody(){return `<div class="module-tabs" role="group" aria-label="选择研读模块">${modules.map((m,i)=>`<button type="button" data-module="${i}" aria-pressed="${i===moduleIndex}">${m.code} / ${m.name}</button>`).join('')}</div>${implementationDetail()}`}
function quizHTML(l){return `<details class="quiz-disclosure"><summary>检查一下理解</summary><section class="question" aria-labelledby="quizHeading"><div class="question-content"><h2 id="quizHeading">${l.quiz}</h2><div class="quiz-options" role="group" aria-label="自测选项">${l.options.map((o,i)=>`<button type="button" data-answer="${i}" aria-pressed="${answers[l.id]===i}">${o}</button>`).join('')}</div><p class="quiz-feedback" id="quizFeedback" role="status" aria-live="polite"></p></div></section></details>`}
const bodies=[modelBody,capabilityBody,journeyBody,architectureBody,implementationBody];
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sourcesHTML(layer){if(!Array.isArray(layer.sources)||!layer.sources.length)return '';return '<details class="source-evidence"><summary>源码依据（'+layer.sources.length+' 处）</summary><ul>'+layer.sources.map(source=>'<li><code>'+escapeHTML(source.path)+':'+escapeHTML(source.lines)+'</code><span> — '+escapeHTML(source.note)+'</span></li>').join('')+'</ul></details>'}
function render(focus=false){
 const route=location.hash.slice(1).split('?')[0];current=Math.max(0,layers.findIndex(l=>l.id===route));scenario=routeValue('scene',0,3);step=routeValue('step',0,6);moduleIndex=routeValue('module',0,3);
 const l=layers[current];document.title=l.name+' · 后台任务系统';$('#crumb').textContent=l.name;nav();
 if(l.ready===false){$('#main').innerHTML='<article class="page"><header class="hero"><h1>'+escapeHTML(l.name)+'</h1><p>这一层尚未开展学习。完成当前层后，再逐步补充这里的内容。</p></header></article>';closeMenu(false);if(focus){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}return}

 $('#main').innerHTML=`<article class="page"><div class="eyebrow">第 ${current+1} 层<span class="eyebrow-dot" aria-hidden="true">·</span>${l.name}</div><header class="hero"><div><h1>${l.title}</h1><p>${l.desc}</p></div><div class="hero-number" aria-hidden="true">0${current+1}</div></header><div class="meta-row"><span class="dot">${l.time}</span><span>本层目标：${l.goal}</span></div>${bodies[current]()}${sourcesHTML(l)}${quizHTML(l)}<footer class="page-footer"><div class="footer-note"><strong>本层阅读完成</strong>${current<4?'下一层 · '+layers[current+1].name+' / '+layers[current+1].sub:'已到最后一层，可以回看任意章节。'}</div><div class="footer-actions"><button class="secondary" id="masterButton" type="button" aria-pressed="${mastered.has(l.id)}">${mastered.has(l.id)?'✓ 已确认理解':'确认理解本层'}</button><a class="primary" href="#${current<4?layers[current+1].id:'model'}">${current<4?'去看'+layers[current+1].name:'回到心智模型'} <span aria-hidden="true">↗</span></a></div></footer></article>`;
 if(answers[l.id]!==undefined)showAnswer(answers[l.id]);
 closeMenu(false);if(focus){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}
}
function showAnswer(value){const l=layers[current];answers[l.id]=value;document.querySelectorAll('[data-answer]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.answer)===value));const feedback=$('#quizFeedback');feedback.classList.toggle('wrong',value!==l.answer);feedback.textContent=(value===l.answer?'理解正确。':'再想一步。')+l.explain; }
function closeMenu(restore=true){const wasOpen=$('#sidebar').classList.contains('open');$('#sidebar').classList.remove('open');$('#sidebar').removeAttribute('role');$('#sidebar').removeAttribute('aria-modal');$('.main').inert=false;$('.skip').inert=false;document.body.style.overflow='';$('#openMenu').setAttribute('aria-expanded','false');if(wasOpen&&restore)$('#openMenu').focus()}
$('#openMenu').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');if(!open){closeMenu();return}$('#sidebar').classList.add('open');$('#sidebar').setAttribute('role','dialog');$('#sidebar').setAttribute('aria-modal','true');$('.main').inert=true;$('.skip').inert=true;document.body.style.overflow='hidden';$('#openMenu').setAttribute('aria-expanded','true');$('#closeMenu').focus()});
$('#closeMenu').addEventListener('click',()=>closeMenu());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(e.key==='Tab'&&$('#sidebar').classList.contains('open')){const items=[...$('#sidebar').querySelectorAll('a,button')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
matchMedia('(min-width:761px)').addEventListener('change',e=>{if(e.matches)closeMenu(false)});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.scenario!==undefined){scenario=Number(b.dataset.scenario);document.querySelectorAll('[data-scenario]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#scenarioBody').outerHTML=scenarioHTML();updateRoute('scene',scenario);announce('已切换到'+scenarios[scenario].name+'场景')}
 if(b.dataset.step!==undefined){const oldDirection=b.textContent.includes('上一步')?'prev':b.textContent.includes('下一步')?'next':null;step=Number(b.dataset.step);document.querySelectorAll('.step-list [data-step]').forEach(x=>{x.removeAttribute('aria-current');if(Number(x.dataset.step)===step)x.setAttribute('aria-current','step')});$('#stepDetail').outerHTML=stepDetail();updateRoute('step',step);if(oldDirection){const buttons=$('#stepDetail').querySelectorAll('button');const preferred=buttons[oldDirection==='next'?1:0];(preferred.disabled?buttons[oldDirection==='next'?0:1]:preferred).focus()}announce(`第${step+1}步，${steps[step].title}。${steps[step].text}`)}
 if(b.dataset.arch!==undefined){moduleIndex=Number(b.dataset.arch);document.querySelectorAll('[data-arch]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#archDetail').outerHTML=archDetail();updateRoute('module',moduleIndex);announce(modules[moduleIndex].code+'职责已展开')}
 if(b.dataset.module!==undefined){moduleIndex=Number(b.dataset.module);document.querySelectorAll('[data-module]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#moduleDetail').outerHTML=implementationDetail();updateRoute('module',moduleIndex);announce('已切换到'+modules[moduleIndex].name)}
 if(b.dataset.answer!==undefined)showAnswer(Number(b.dataset.answer));
 if(b.id==='masterButton'){const id=layers[current].id;if(mastered.has(id))mastered.delete(id);else mastered.add(id);persist();nav();b.setAttribute('aria-pressed',mastered.has(id));b.textContent=mastered.has(id)?'✓ 已确认理解':'确认理解本层';announce(mastered.has(id)?'已记录理解进度':'已取消理解标记')}
});
window.addEventListener('hashchange',()=>render(true));
render();
</script>
</body>
</html>
